name: Publish to npm

# Two publish paths, both from main, both run by hand:
#
#   `publish`  a release. Versions come from the merged "Version Packages" PR, and go
#              out under the `latest` dist-tag, tagged and released.
#   `canary`   a snapshot of main under the `canary` dist-tag. No commit, no git tag,
#              no GitHub Release, and `latest` never moves.
#
# Both live in this file because npm trusted publishing keys on the workflow filename:
# each package trusts `publish.yml` and nothing else, so a canary in its own file
# would fail the OIDC exchange for all seven packages.
#
# The trusted-publisher entries must leave the optional environment field unset. It is
# what lets `publish` sit behind `npm-release`'s required reviewers while `canary`
# publishes without one; pinning them to `npm-release` would force snapshots through a
# release approval.
#
# Renaming this file breaks tokenless publishing until every package's npmjs.com
# settings are updated to match.
#
# Release flow: docs/releasing.md

on:
  workflow_dispatch:
    inputs:
      canary:
        description: 'Publish a canary snapshot instead of a release'
        type: boolean
        default: false

concurrency:
  # Never cancel a run mid-flight: a cancelled publish can leave part of the
  # fixed-version group on npm and the rest not.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: ${{ !inputs.canary }}
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in repo settings — without them
    # a dispatch publishes immediately, with no second pair of eyes.
    environment: npm-release
    permissions:
      contents: write # push per-package tags, create per-package releases
      id-token: write # npm OIDC trusted publishing (no token)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
          scope: '@pantheon-systems'

      # changesets/action takes the version-PR path whenever changesets are
      # pending, even if only a publish script is given — so publishing with any
      # left over would silently open a PR instead of releasing.
      - name: Fail if changesets are still pending
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending" -ne 0 ]; then
            find .changeset -name '*.md' ! -name 'README.md'
            echo "::error::$pending changeset(s) still pending — merge the \"Version Packages\" PR before publishing."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm exec turbo run build --filter='./packages/*'

      # PCC-3819: comments, JSDoc, package.json fields, and READMEs had been
      # shipping internal ticket refs, service codenames, and backend
      # implementation details to the public npm registry. This packs each
      # public package exactly as `npm publish` would and greps the result.
      - name: Guard against internal-architecture leaks
        run: |
          bash .github/scripts/check-npm-leaks.sh --self-test
          bash .github/scripts/check-npm-leaks.sh

      # Publishes each package whose version isn't on npm yet, pushes one tag per
      # package, and creates one GitHub Release per tag (createGithubReleases
      # defaults to true) — three packages published means three releases.
      - name: Publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          if [ "$PUBLISHED" != "true" ]; then
            echo "Nothing to publish — every version on main is already on npm." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo "$PACKAGES" | jq -r '.[] | "- `\(.name)@\(.version)`"' >> "$GITHUB_STEP_SUMMARY"

  canary:
    if: inputs.canary
    runs-on: ubuntu-latest
    permissions:
      # A snapshot pushes no commit and no tag, so this job never needs write access
      # to the repo.
      contents: read
      id-token: write # npm OIDC trusted publishing (no token)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'
          scope: '@pantheon-systems'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must precede the build: it writes the snapshot version into every manifest, and
      # create-p1-starter-kit reads those manifests to pin the SDK versions its template
      # installs. Pending changesets are consumed here and never committed.
      - name: Apply snapshot versions
        run: pnpm ci:version:canary

      - name: Build publishable packages
        run: pnpm exec turbo run build --filter='./packages/*'

      # A canary reaches the public registry the same way a release does, so it gets
      # the same leak gate.
      - name: Guard against internal-architecture leaks
        run: |
          bash .github/scripts/check-npm-leaks.sh --self-test
          bash .github/scripts/check-npm-leaks.sh

      # Run directly rather than through changesets/action, which cuts a GitHub Release
      # per published package — seven per run, for builds that are not releases.
      - name: Publish
        run: |
          set -o pipefail
          pnpm ci:publish:canary | tee publish.log

      - name: Summarize
        run: |
          echo '### Published to `canary`' >> "$GITHUB_STEP_SUMMARY"
          grep -oE '@pantheon-systems/[a-z0-9-]+@[0-9][^ ]*' publish.log \
            | sort -u | sed 's/^/- `/;s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Install with `pnpm add <package>@canary`.' >> "$GITHUB_STEP_SUMMARY"

name: Publish to npm

# Filename intentionally kept as publish.yml to match the npm trusted-publisher
# (OIDC) config; renaming would break tokenless publishing until npm is updated.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" PR / tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # required for npm OIDC trusted publishing (no token)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"
          scope: "@pantheon-systems"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm --filter @pantheon-systems/p1-ai-chat build

      # When there are pending changesets, opens/updates a "Version Packages" PR
      # that bumps the version and updates CHANGELOG. When that PR is merged (no
      # pending changesets remain), runs ci:publish to publish to npm via OIDC.
      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Admin — Site Export/Import (PROPOSAL-013)
  # ===========================================================================
  /api/admin/sites/{siteId}/export:
    get:
      summary: Export site bundle
      description: |
        Assembles a full site bundle as a versioned ZIP file, writes it to R2, and returns
        a presigned download URL (7-day TTL) plus an HMAC-SHA256 signature.

        The bundle is self-contained and integrity-verified:
        - `bundle.json` contains a SHA-256 manifest of all other files
        - `bundleSignature` in the response is an HMAC-SHA256 of `bundle.json` keyed to
          `INTERNAL_SECRET`; pass it as `bundleSignature` when calling the import endpoint
          so tampered bundles are rejected

        **Version selection:**
        - Main branch: all published versions + latest draft if not yet published
        - Non-main branches: latest version only
        - `_registry/` documents are excluded (they rebuild automatically on first editor open)

        **What is NOT exported:** Yjs/CRDT state, collaborators/agent roles, site API tokens,
        allowed origins.

        **Size limit:** Bundle is assembled in memory. For very large sites, use the SQL
        migration path instead.

        Requires `read:all` or `write:create` scoped `sat_` token, or admin credentials.
      operationId: exportSite
      tags: [Admin]
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Bundle written to R2; presigned URL and signature returned
          content:
            application/json:
              schema:
                type: object
                required: [downloadUrl, expiresAt, exportedAt, bundleKey, documentCount, branchCount]
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                    description: Presigned R2 download URL (7-day TTL)
                  expiresAt:
                    type: string
                    format: date-time
                  exportedAt:
                    type: string
                    format: date-time
                  bundleKey:
                    type: string
                    description: R2 object key (e.g. `{siteId}/{timestamp}.zip`)
                  bundleSignature:
                    type: string
                    description: |
                      HMAC-SHA256 of bundle.json keyed to INTERNAL_SECRET.
                      Pass this as `bundleSignature` when calling the import endpoint.
                      Absent if INTERNAL_SECRET is not configured on the source environment.
                  documentCount:
                    type: integer
                  branchCount:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: R2 bundle storage not configured

  /api/admin/sites/{siteId}/import:
    post:
      summary: Import site bundle
      description: |
        Accepts a multipart ZIP bundle and imports it into the target site.

        **Processing order:** site → branches → documents → versions → publish checkpoints

        **Idempotency:** Progress is tracked in KV keyed by `(targetSiteId, exportedAt)`.
        Re-running the same import resumes from where it left off. The empty-site check is
        skipped on resume, so partial imports can be continued safely.

        **Target site requirements:** Must be empty (no non-registry documents, no non-main
        branches) for a first-time import.

        **UUID remapping:** All source UUIDs are replaced with new UUIDs on the target.
        Source IDs are stored in `import_id_maps` for traceability.

        **Collaborators:** Users and agents with roles on the source site are listed in
        `requiresSetup.collaborators` in the response. They are never created automatically
        — the operator must add them manually.

        Requires `write:create` scoped `sat_` token or admin credentials on the **target** site.
      operationId: importSite
      tags: [Admin]
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP bundle produced by the export endpoint
                bundleSignature:
                  type: string
                  description: |
                    HMAC-SHA256 signature returned by the export endpoint.
                    When provided, the import verifies the signature before processing
                    any data. Strongly recommended — omitting it skips tamper detection.
      responses:
        '200':
          description: Import complete (or resumed)
          content:
            application/json:
              schema:
                type: object
                required: [importKey, completedPhases, documentCount, sourceSiteId, crossSiteImport]
                properties:
                  importKey:
                    type: string
                    description: KV key for this import run (use to resume)
                  completedPhases:
                    type: array
                    items:
                      type: string
                    description: Phases completed in this run (including prior runs)
                  documentCount:
                    type: integer
                  sourceSiteId:
                    type: string
                    format: uuid
                  crossSiteImport:
                    type: boolean
                    description: True when source and target site IDs differ (migration use case)
                  requiresSetup:
                    type: object
                    description: Resources that must be configured manually on the target
                    properties:
                      collaborators:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              type: object
                              properties:
                                email:
                                  type: string
                                name:
                                  type: string
                                role:
                                  type: string
                          agents:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                role:
                                  type: string
        '400':
          description: Invalid or corrupt ZIP
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Target site is not empty (first-time import only)
        '422':
          description: Bundle manifest validation failed or signature mismatch

  # ===========================================================================
  # Admin — User Allowlist
  # ===========================================================================
  /api/admin/users:
    get:
      summary: List system users
      description: Returns all users in the allowlist. System admin only.
      operationId: listAdminUsers
      tags: [Admin]
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemUser'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Add user to allowlist
      description: Adds a user to the system allowlist. System admin only. On first user creation (bootstrap), the calling principal is also added as admin.
      operationId: addAdminUser
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSystemUserRequest'
      responses:
        '201':
          description: User added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: User UUID
        schema:
          type: string
          format: uuid
    patch:
      summary: Update system user
      description: Updates name, systemRole, or isActive for a user. System admin only.
      operationId: updateAdminUser
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSystemUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Remove user from allowlist
      description: Permanently removes a user from the system allowlist. System admin only.
      operationId: deleteAdminUser
      tags: [Admin]
      responses:
        '204':
          description: User removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT/OAuth token from the CSS OAuth 2.0 flow (/auth/authorize)

    apiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for agent authentication

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    offsetParam:
      name: offset
      in: query
      description: Number of items to skip
      schema:
        type: integer
        minimum: 0
        default: 0

    siteIdParam:
      name: siteId
      in: path
      required: true
      description: Site UUID
      schema:
        type: string
        format: uuid

    branchIdParam:
      name: branchId
      in: path
      required: true
      description: Branch UUID
      schema:
        type: string
        format: uuid

    documentIdParam:
      name: documentId
      in: path
      required: true
      description: Document UUID
      schema:
        type: string
        format: uuid

    orgIdParam:
      name: orgId
      in: path
      required: true
      description: Organization UUID
      schema:
        type: string
        format: uuid

    agentIdParam:
      name: agentId
      in: path
      required: true
      description: Agent UUID
      schema:
        type: string
        format: uuid

    structureIdParam:
      name: structureId
      in: path
      required: true
      description: Structure UUID
      schema:
        type: string
        format: uuid

    nodeIdParam:
      name: nodeId
      in: path
      required: true
      description: Node UUID
      schema:
        type: string
        format: uuid

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # -------------------------------------------------------------------------
    # Common Schemas
    # -------------------------------------------------------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        details:
          type: object
          properties:
            reason:
              type: string
            suggestions:
              type: array
              items:
                type: string

    PaginatedResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        limit:
          type: integer
          description: Page size
        offset:
          type: integer
          description: Current offset

    # -------------------------------------------------------------------------
    # Enums
    # -------------------------------------------------------------------------
    ActorType:
      type: string
      enum: [user, agent, guest, service, system]

    SiteRole:
      type: string
      enum: [owner, admin, developer, team_member]

    RoleName:
      type: string
      enum: [NO_ACCESS, VIEWER, EDITOR, ADMIN]

    BranchStatus:
      type: string
      enum: [active, review, merged, archived]

    CheckpointType:
      type: string
      enum: [manual, auto, pre_merge, post_merge, agent_pre_edit, agent_post_edit]

    CheckpointTrigger:
      type: string
      enum: [manual, human_requested, autonomous]

    CheckpointStatus:
      type: string
      enum: [completed, rolled_back, partial]

    DocumentVersionSource:
      type: string
      enum: [edit, merge, revert, checkpoint, realtime]

    MergeRequestStatus:
      type: string
      enum: [open, approved, merged, closed, conflicted]

    AgentStatus:
      type: string
      enum: [active, suspended, disabled]

    PresenceState:
      type: string
      enum: [active, idle, editing]

    StructureType:
      type: string
      enum: [collection, hierarchy]

    NodeType:
      type: string
      enum: [section, document, external]

    SchemaEnforcementMode:
      type: string
      enum: [strict, warn, none]

    EditOperationType:
      type: string
      enum: [set, delete, insert, move, replace]

    ConflictResolutionStrategy:
      type: string
      enum: [take-source, take-target, manual]

    MergeApprovalMode:
      type: string
      enum: [none, optional, required]

    ApproverMode:
      type: string
      enum: [role_based, explicit, both]

    # -------------------------------------------------------------------------
    # Health
    # -------------------------------------------------------------------------
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        database:
          type: object
          properties:
            connected:
              type: boolean
            latencyMs:
              type: number
        timestamp:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Authentication
    # -------------------------------------------------------------------------
    # -------------------------------------------------------------------------
    # Organizations
    # -------------------------------------------------------------------------
    OrganizationSettings:
      type: object
      properties:
        agentIdleTimeoutMs:
          type: integer
          minimum: 0
          default: 5000
          description: Idle time before autonomous agents can edit

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        settings:
          $ref: '#/components/schemas/OrganizationSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the organization was soft-deleted; null if active.

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        settings:
          $ref: '#/components/schemas/OrganizationSettings'

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        settings:
          $ref: '#/components/schemas/OrganizationSettings'

    OrganizationListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Organization'

    # -------------------------------------------------------------------------
    # Agents
    # -------------------------------------------------------------------------
    AgentSettings:
      type: object
      properties:
        priorityTier:
          type: string
        allowedOperationTypes:
          type: array
          items:
            type: string
        maxConcurrentDocuments:
          type: integer
          minimum: 1

    RegisteredAgent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/AgentStatus'
        settings:
          $ref: '#/components/schemas/AgentSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAgentRequest:
      type: object
      required: [name, capabilities]
      properties:
        name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
        settings:
          $ref: '#/components/schemas/AgentSettings'

    UpdateAgentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
        settings:
          $ref: '#/components/schemas/AgentSettings'

    AgentListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RegisteredAgent'

    # -------------------------------------------------------------------------
    # Sites
    # -------------------------------------------------------------------------
    WorkflowSettings:
      type: object
      properties:
        mergeApprovalMode:
          $ref: '#/components/schemas/MergeApprovalMode'
        minApprovers:
          type: integer
          minimum: 1
          default: 1
        allowSelfApproval:
          type: boolean
          default: false
        approverMode:
          $ref: '#/components/schemas/ApproverMode'
        approverMinRole:
          type: string
          enum: [EDITOR, ADMIN]

    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pantheonSiteId:
          type: string
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        workflowSettings:
          $ref: '#/components/schemas/WorkflowSettings'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the site was soft-deleted; null if active.

    CreateSiteRequest:
      type: object
      required: [pantheonSiteId, name]
      properties:
        pantheonSiteId:
          type: string
        name:
          type: string
        organizationId:
          type: string
          format: uuid
        workflowSettings:
          $ref: '#/components/schemas/WorkflowSettings'

    UpdateSiteRequest:
      type: object
      properties:
        name:
          type: string
        workflowSettings:
          $ref: '#/components/schemas/WorkflowSettings'

    SiteListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Site'

    # -------------------------------------------------------------------------
    # Branches
    # -------------------------------------------------------------------------
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/BranchStatus'
        isMain:
          type: boolean
        sourceBranchId:
          type: string
          format: uuid
        sourceCheckpointId:
          type: string
          format: uuid
        createdById:
          type: string
          format: uuid
        createdByType:
          type: string
          enum: [user, agent]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when the branch was soft-deleted; null if active.

    CreateBranchRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        parentBranchId:
          type: string
          format: uuid
          description: Branch to fork from (defaults to main)

    UpdateBranchRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/BranchStatus'

    BranchListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Branch'

    # -------------------------------------------------------------------------
    # Documents
    # -------------------------------------------------------------------------
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        path:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateDocumentRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Unique document path within site

    CreateBranchDocumentRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
        initialContent:
          type: object
          additionalProperties: true
          description: Initial document content

    DocumentListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Document'

    # -------------------------------------------------------------------------
    # Document Versions
    # -------------------------------------------------------------------------
    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        snapshot:
          type: object
          additionalProperties: true
        crdtState:
          type: string
          description: Base64-encoded document sync state
        source:
          $ref: '#/components/schemas/DocumentVersionSource'
        createdById:
          type: string
          format: uuid
        createdByType:
          type: string
          enum: [user, agent, system]
        createdAt:
          type: string
          format: date-time

    CreateVersionRequest:
      type: object
      required: [snapshot]
      properties:
        snapshot:
          type: object
          additionalProperties: true
        source:
          $ref: '#/components/schemas/DocumentVersionSource'
          default: edit

    DocumentVersionListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/DocumentVersion'

    # -------------------------------------------------------------------------
    # Real-time Operations
    # -------------------------------------------------------------------------
    DocumentState:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        content:
          type: object
          additionalProperties: true
        versionNumber:
          type: integer
        lastUpdated:
          type: string
          format: date-time

    EditOperation:
      type: object
      required: [type, path]
      properties:
        type:
          $ref: '#/components/schemas/EditOperationType'
        path:
          type: string
          description: JSON path to target
        value:
          description: Value for set/replace operations
        content:
          description: Content for insert operations
        index:
          type: integer
          description: Array index for insert operations
        fromIndex:
          type: integer
          description: Source index for move operations
        toIndex:
          type: integer
          description: Destination index for move operations

    EditOperationsRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/EditOperation'
          maxItems: 100

    # -------------------------------------------------------------------------
    # Agent Edit Workflow
    # -------------------------------------------------------------------------
    AgentEditCheckRequest:
      type: object
      required: [agentId, trigger, targetRegions]
      properties:
        agentId:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [human_requested, autonomous]
        targetRegions:
          type: array
          items:
            type: string
          description: JSON paths the agent intends to edit

    AgentEditPermission:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum: [human_active, region_conflict, agent_disabled, no_access]
        retryAfterMs:
          type: integer
          description: Suggested retry delay in milliseconds
        conflictingRegions:
          type: array
          items:
            type: string

    AgentEditStartRequest:
      type: object
      required: [agentId, trigger, targetRegions]
      properties:
        agentId:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [human_requested, autonomous]
        intent:
          type: string
          description: Human-readable description of intended action
        targetRegions:
          type: array
          items:
            type: string

    AgentEditStartResponse:
      type: object
      properties:
        preEditCheckpoint:
          $ref: '#/components/schemas/Checkpoint'
        sessionId:
          type: string
          format: uuid

    AgentEditCompleteRequest:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
          format: uuid
        summary:
          type: string
          description: Summary of changes made

    AgentEditAbortRequest:
      type: object
      required: [agentId]
      properties:
        agentId:
          type: string
          format: uuid
        reason:
          type: string
          description: Reason for aborting

    # -------------------------------------------------------------------------
    # Checkpoints
    # -------------------------------------------------------------------------
    Checkpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        name:
          type: string
        message:
          type: string
        description:
          type: string
        checkpointType:
          $ref: '#/components/schemas/CheckpointType'
        trigger:
          $ref: '#/components/schemas/CheckpointTrigger'
        requestedById:
          type: string
          format: uuid
        operationType:
          type: string
        affectedRegions:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/CheckpointStatus'
        rolledBackById:
          type: string
          format: uuid
        rolledBackAt:
          type: string
          format: date-time
        createdById:
          type: string
          format: uuid
        createdByType:
          type: string
          enum: [user, agent, system]
        createdAt:
          type: string
          format: date-time

    CreateCheckpointRequest:
      type: object
      properties:
        name:
          type: string
        message:
          type: string
        description:
          type: string
        checkpointType:
          $ref: '#/components/schemas/CheckpointType'
          default: manual

    CheckpointListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Checkpoint'

    # -------------------------------------------------------------------------
    # Merge
    # -------------------------------------------------------------------------
    MergeCheckRequest:
      type: object
      required: [sourceBranchId, targetBranchId]
      properties:
        sourceBranchId:
          type: string
          format: uuid
        targetBranchId:
          type: string
          format: uuid

    MergeCheckResponse:
      type: object
      properties:
        mergeableStatus:
          type: string
          enum: [clear, conflicts, errors]
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/DocumentConflict'
        structureConflicts:
          type: array
          items:
            $ref: '#/components/schemas/StructureMergeConflict'

    DocumentConflict:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        documentPath:
          type: string
        conflictType:
          type: string
          enum: [both-modified, deleted-in-source, deleted-in-target]
        sourceVersion:
          type: integer
        targetVersion:
          type: integer
        suggestedResolution:
          $ref: '#/components/schemas/ConflictResolutionStrategy'

    StructureMergeConflict:
      type: object
      properties:
        structureId:
          type: string
          format: uuid
        conflictType:
          type: string
          enum: [node-move, node-delete, schema-change, metadata-change]
        details:
          type: object
          properties:
            nodeId:
              type: string
              format: uuid
            documentId:
              type: string
              format: uuid
            sourceValue: {}
            targetValue: {}
            baseValue: {}

    MergePreviewResponse:
      allOf:
        - $ref: '#/components/schemas/MergeCheckResponse'
        - type: object
          properties:
            preview:
              type: object
              properties:
                addedDocuments:
                  type: array
                  items:
                    type: string
                modifiedDocuments:
                  type: array
                  items:
                    type: string
                deletedDocuments:
                  type: array
                  items:
                    type: string

    ConflictResolution:
      type: object
      required: [documentId, strategy]
      properties:
        documentId:
          type: string
          format: uuid
        strategy:
          $ref: '#/components/schemas/ConflictResolutionStrategy'
        manualContent:
          type: object
          additionalProperties: true
          description: Required when strategy is 'manual'

    MergeExecuteRequest:
      type: object
      required: [sourceBranchId, targetBranchId]
      properties:
        sourceBranchId:
          type: string
          format: uuid
        targetBranchId:
          type: string
          format: uuid
        message:
          type: string
        conflictResolutions:
          type: array
          items:
            $ref: '#/components/schemas/ConflictResolution'

    MergeExecuteResponse:
      type: object
      properties:
        success:
          type: boolean
        mergeCheckpoint:
          $ref: '#/components/schemas/Checkpoint'
        mergedDocuments:
          type: integer
        createdAt:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Merge Requests
    # -------------------------------------------------------------------------
    MergeRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        sourceBranchId:
          type: string
          format: uuid
        targetBranchId:
          type: string
          format: uuid
        baseCheckpointId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/MergeRequestStatus'
        hasConflicts:
          type: boolean
        conflictDetails:
          type: object
          properties:
            documentConflicts:
              type: array
              items:
                $ref: '#/components/schemas/DocumentConflict'
            structureConflicts:
              type: array
              items:
                $ref: '#/components/schemas/StructureMergeConflict'
        createdById:
          type: string
          format: uuid
        createdByType:
          type: string
          enum: [user, agent]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        mergedAt:
          type: string
          format: date-time
        mergedById:
          type: string
          format: uuid

    CreateMergeRequestRequest:
      type: object
      required: [sourceBranchId, targetBranchId, title]
      properties:
        sourceBranchId:
          type: string
          format: uuid
        targetBranchId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string

    UpdateMergeRequestRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/MergeRequestStatus'

    MergeRequestListResponse:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MergeRequest'

    # -------------------------------------------------------------------------
    # Structures
    # -------------------------------------------------------------------------
    SiteStructure:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        structureType:
          $ref: '#/components/schemas/StructureType'
        createdAt:
          type: string
          format: date-time

    CreateStructureRequest:
      type: object
      required: [name, slug, structureType]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        structureType:
          $ref: '#/components/schemas/StructureType'

    UpdateStructureRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    StructureListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteStructure'

    NavigationTree:
      type: object
      properties:
        structureId:
          type: string
          format: uuid
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/NavigationNode'

    NavigationNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        nodeType:
          $ref: '#/components/schemas/NodeType'
        documentId:
          type: string
          format: uuid
        externalUrl:
          type: string
          format: uri
        children:
          type: array
          items:
            $ref: '#/components/schemas/NavigationNode'

    BranchStructureState:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        structureId:
          type: string
          format: uuid
        nodesSnapshot:
          type: array
          items:
            type: object
        metadataSchema:
          type: object
          description: JSON Schema for document metadata
        schemaEnforcement:
          $ref: '#/components/schemas/SchemaEnforcementMode'
        updatedAt:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Structure Nodes
    # -------------------------------------------------------------------------
    StructureNode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        structureId:
          type: string
          format: uuid
        parentNodeId:
          type: string
          format: uuid
        position:
          type: integer
        name:
          type: string
        slug:
          type: string
        nodeType:
          $ref: '#/components/schemas/NodeType'
        documentId:
          type: string
          format: uuid
        externalUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time

    CreateNodeRequest:
      type: object
      required: [name, slug, nodeType]
      properties:
        parentNodeId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        nodeType:
          $ref: '#/components/schemas/NodeType'
        documentId:
          type: string
          format: uuid
          description: Required for document nodes
        externalUrl:
          type: string
          format: uri
          description: Required for external nodes
        position:
          type: integer
          minimum: 0

    UpdateNodeRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        externalUrl:
          type: string
          format: uri

    NodeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StructureNode'

    # -------------------------------------------------------------------------
    # Document Metadata
    # -------------------------------------------------------------------------
    BranchDocumentMetadata:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        structureId:
          type: string
          format: uuid
        metadata:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time

    SchemaValidationError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
        currentValue: {}

    SchemaValidationResult:
      type: object
      properties:
        structureId:
          type: string
          format: uuid
        totalDocuments:
          type: integer
        conformingDocuments:
          type: integer
        nonConformingDocuments:
          type: array
          items:
            type: object
            properties:
              documentId:
                type: string
                format: uuid
              documentPath:
                type: string
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/SchemaValidationError'

    # -------------------------------------------------------------------------
    # Branch Grants
    # -------------------------------------------------------------------------
    BranchGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorType:
          type: string
          enum: [user, agent]
        role:
          $ref: '#/components/schemas/RoleName'
        grantedById:
          type: string
          format: uuid
        grantedByType:
          type: string
          enum: [user, agent]
        grantedAt:
          type: string
          format: date-time
        reason:
          type: string

    CreateBranchGrantRequest:
      type: object
      required: [principalId, principalType, role]
      properties:
        principalId:
          type: string
          format: uuid
        principalType:
          type: string
          enum: [user, agent]
        role:
          $ref: '#/components/schemas/RoleName'
        reason:
          type: string

    BranchGrantListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BranchGrant'

    # -------------------------------------------------------------------------
    # Presence
    # -------------------------------------------------------------------------
    ActorPresence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        actorType:
          type: string
          enum: [user, agent]
        role:
          type: string
          enum: [human, agent]
        name:
          type: string
        avatar:
          type: string
          format: uri
        state:
          $ref: '#/components/schemas/PresenceState'
        intent:
          type: string
          description: Agent's declared intent
        focusRegions:
          type: array
          items:
            type: string
        lastActivityAt:
          type: string
          format: date-time
        joinedAt:
          type: string
          format: date-time

    PresenceSummary:
      type: object
      properties:
        totalActors:
          type: integer
        humanCount:
          type: integer
        agentCount:
          type: integer
        editingCount:
          type: integer

    DocumentPresenceSummary:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        documentPath:
          type: string
        actorCount:
          type: integer
        hasHumans:
          type: boolean
        hasAgents:
          type: boolean

    BranchPresenceSummary:
      type: object
      properties:
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        actorCount:
          type: integer
        hasHumans:
          type: boolean
        hasAgents:
          type: boolean

    BranchPresence:
      type: object
      properties:
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        siteId:
          type: string
          format: uuid
        summary:
          $ref: '#/components/schemas/PresenceSummary'
        actors:
          type: array
          items:
            $ref: '#/components/schemas/ActorPresence'
        documentSummary:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPresenceSummary'

    SitePresence:
      type: object
      properties:
        siteId:
          type: string
          format: uuid
        siteName:
          type: string
        summary:
          type: object
          properties:
            totalActors:
              type: integer
            humanCount:
              type: integer
            agentCount:
              type: integer
            activeBranches:
              type: integer
        branches:
          type: array
          items:
            $ref: '#/components/schemas/BranchPresenceSummary'

    AgentPresenceLocation:
      type: object
      properties:
        siteId:
          type: string
          format: uuid
        siteName:
          type: string
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        documentId:
          type: string
          format: uuid
        documentPath:
          type: string
        presence:
          $ref: '#/components/schemas/ActorPresence'

    AgentGlobalPresence:
      type: object
      properties:
        agentId:
          type: string
          format: uuid
        agentName:
          type: string
        organizationId:
          type: string
          format: uuid
        locations:
          type: array
          items:
            $ref: '#/components/schemas/AgentPresenceLocation'

    # -------------------------------------------------------------------------
    # WebSocket Messages (for reference)
    # -------------------------------------------------------------------------
    WsFocusRegionUpdateMessage:
      type: object
      required: [type, focusRegions, timestamp]
      properties:
        type:
          type: string
          const: focus_region_update
        focusRegions:
          type: array
          items:
            type: string
        timestamp:
          type: integer

    WsPresenceHeartbeatMessage:
      type: object
      required: [type, timestamp]
      properties:
        type:
          type: string
          const: presence_heartbeat
        state:
          $ref: '#/components/schemas/PresenceState'
        timestamp:
          type: integer

    WsPresenceUpdateMessage:
      type: object
      required: [type, actors, timestamp]
      properties:
        type:
          type: string
          const: presence_update
        actors:
          type: array
          items:
            $ref: '#/components/schemas/ActorPresence'
        timestamp:
          type: integer

    WsFocusRegionBroadcastMessage:
      type: object
      required: [type, actorId, focusRegions, timestamp]
      properties:
        type:
          type: string
          const: focus_region_broadcast
        actorId:
          type: string
        focusRegions:
          type: array
          items:
            type: string
        timestamp:
          type: integer

    WsFocusRegionAckMessage:
      type: object
      required: [type, success, focusRegions, timestamp]
      properties:
        type:
          type: string
          const: focus_region_ack
        success:
          type: boolean
        focusRegions:
          type: array
          items:
            type: string
        timestamp:
          type: integer

    WsPresenceErrorMessage:
      type: object
      required: [type, code, message, timestamp]
      properties:
        type:
          type: string
          const: presence_error
        code:
          type: string
        message:
          type: string
        timestamp:
          type: integer

    # -------------------------------------------------------------------------
    # Authentication
    # -------------------------------------------------------------------------
    AuthenticatedPrincipal:
      type: object
      properties:
        id:
          type: string
          description: Principal identifier (OAuth subject or agent ID)
        type:
          $ref: '#/components/schemas/ActorType'
        email:
          type: string
          format: email
        name:
          type: string
        avatarUrl:
          type: string
          format: uri
          nullable: true
        authProvider:
          type: string
          description: Identity provider used to authenticate this principal
        tokenExpiry:
          type: string
          format: date-time
          nullable: true
          description: When the current token expires (if available)
        providerSubjectId:
          type: string
          nullable: true
          description: Raw subject ID from the upstream identity provider

    # -------------------------------------------------------------------------
    # Site Settings
    # -------------------------------------------------------------------------
    SiteSettings:
      type: object
      properties:
        cacheTtlMain:
          type: integer
          nullable: true
          description: Cache TTL in seconds for main-branch content. Null uses system default (300s).
        cacheTtlBranch:
          type: integer
          nullable: true
          description: Cache TTL in seconds for non-main-branch content. Null uses system default (60s).

    UpdateSiteSettingsRequest:
      type: object
      properties:
        cacheTtlMain:
          type: integer
          nullable: true
          minimum: 0
          description: Seconds. Null resets to system default.
        cacheTtlBranch:
          type: integer
          nullable: true
          minimum: 0
          description: Seconds. Null resets to system default.

    # -------------------------------------------------------------------------
    # Site Tokens
    # -------------------------------------------------------------------------
    SiteToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    GenerateSiteTokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable label for this token
        scopes:
          type: array
          items:
            type: string
            enum: [read:published, read:all, read:draft, write:create]
          description: |
            Permission scopes for this token. Defaults to [read:published].
            - read:published: GET published content on main branch only
            - read:all: GET all content, documents, and branches
            - read:draft: GET draft and published content on any branch
            - write:create: GET and POST (create) on all handlers and branches; cannot update or delete

    GenerateSiteTokenResponse:
      allOf:
        - $ref: '#/components/schemas/SiteToken'
        - type: object
          properties:
            token:
              type: string
              description: Raw token value — only returned on creation

    # -------------------------------------------------------------------------
    # Collaborators
    # -------------------------------------------------------------------------
    Collaborator:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        siteId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/SiteRole'
        source:
          type: string
          enum: [local, mas]
          description: Whether the grant was created locally or synced from MAS
        email:
          type: string
          format: email
          nullable: true
        name:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GrantCollaboratorRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          description: Principal ID of the user to grant access to
        role:
          $ref: '#/components/schemas/SiteRole'

    # -------------------------------------------------------------------------
    # Content Delivery
    # -------------------------------------------------------------------------
    DocumentContent:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        path:
          type: string
        data:
          type: object
          description: The document's JSON content
          additionalProperties: true
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        isMainBranch:
          type: boolean
        versionNumber:
          type: integer
        versionCreatedAt:
          type: string
          format: date-time
        etag:
          type: string
        inherited:
          type: boolean
          description: True when content was inherited from main branch (non-main branches only)

    ContentPagesResponse:
      type: object
      properties:
        pages:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              documentId:
                type: string
                format: uuid
              lastModifiedAt:
                type: string
                format: date-time
        branchId:
          type: string
          format: uuid
        branchName:
          type: string
        isMainBranch:
          type: boolean

    # -------------------------------------------------------------------------
    # Publish Document
    # -------------------------------------------------------------------------
    PublishDocumentResponse:
      type: object
      description: Result of publishing a document to the main branch
      properties:
        checkpoint:
          $ref: '#/components/schemas/Checkpoint'
        publishedVersionId:
          type: string
          format: uuid
          description: ID of the version created on the main branch
        sourceBranchName:
          type: string
          nullable: true
          description: Name of the branch the document was published from

    # -------------------------------------------------------------------------
    # Agent Keys
    # -------------------------------------------------------------------------
    AgentKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        name:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    GenerateAgentKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable label for this key

    GenerateAgentKeyResponse:
      allOf:
        - $ref: '#/components/schemas/AgentKey'
        - type: object
          properties:
            key:
              type: string
              description: Raw API key value — only returned on creation

    # -------------------------------------------------------------------------
    # Agent Site Roles
    # -------------------------------------------------------------------------
    AgentSiteRole:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        role:
          type: string
          enum: [viewer, editor, admin]
        grantedBy:
          type: string
        createdAt:
          type: string
          format: date-time

    GrantAgentRoleRequest:
      type: object
      required: [siteId, role]
      properties:
        siteId:
          type: string
          format: uuid
        role:
          type: string
          enum: [viewer, editor, admin]

    GrantSiteAgentRoleRequest:
      type: object
      required: [agentId, role]
      properties:
        agentId:
          type: string
          format: uuid
        role:
          type: string
          enum: [viewer, editor, admin]

    # -------------------------------------------------------------------------
    # System Users (Admin)
    # -------------------------------------------------------------------------
    SystemUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        principalId:
          type: string
          nullable: true
          description: OAuth subject ID, populated on first login
        authProvider:
          type: string
          nullable: true
          description: Identity provider used on first login
        systemRole:
          type: string
          enum: [admin, member]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AddSystemUserRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        systemRole:
          type: string
          enum: [admin, member]
          default: member

    UpdateSystemUserRequest:
      type: object
      properties:
        name:
          type: string
        systemRole:
          type: string
          enum: [admin, member]
        isActive:
          type: boolean

name: Deploy Workers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - sbx1
          - production
      run_migrations:
        description: "Run DB migrations before deploy"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run (no actual deploy)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: workers

      - name: Authenticate to GCP
        if: inputs.run_migrations
        uses: pantheon-systems/common-gh/auth-wif@0a1dafc525b4ffa9fcfbfcf1c889dc0251c0c4e4 # main @ 2026-06
        with:
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        if: inputs.run_migrations
        run: |
          URL="https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.21.2"
          curl "$URL/cloud-sql-proxy.linux.amd64" -o cloud-sql-proxy
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 --auto-iam-authn "${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" &
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && break
            sleep 1
          done

      - name: Run migrations
        if: inputs.run_migrations
        working-directory: workers
        env:
          POSTGRES_SET_ROLE: cssuser
        run: |
          SA='${{ vars.GCP_SERVICE_ACCOUNT }}'
          IAM_USER="${SA%.gserviceaccount.com}"
          ENC_USER="${IAM_USER//@/%40}" # @ must be percent-encoded in the URI userinfo
          export POSTGRES_CONNECTION_STRING="postgresql://${ENC_USER}@localhost:5432/${{ vars.CLOUDSQL_DB_NAME }}"
          pnpm db:migrate

      - name: Deploy
        run: >
          pnpm exec wrangler deploy
          --env ${{ inputs.environment }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  frontend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend

      - name: Deploy
        run: >
          pnpm exec wrangler deploy
          --env ${{ inputs.environment }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

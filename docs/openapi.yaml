openapi: 3.0.3
info:
  title: P1 API
  description: |
    REST API for P1 — a JSON state versioning and real-time collaboration platform.

    ## Overview

    P1 provides:
    - **Version Control**: Git-like branching and merging for JSON documents
    - **Real-time Collaboration**: WebSocket-based collaborative editing with presence awareness
    - **Agent Coordination**: AI agent support with human-first editing priority
    - **Presence Awareness**: Real-time visibility of who is editing what

    ## Authentication

    All authenticated endpoints require one of:
    - **Bearer Token**: `Authorization: Bearer <jwt-token>`
    - **API Key**: `X-API-Key: <api-key>` header or `?apiKey=<key>` query parameter

    ## Rate Limits

    - Standard endpoints: 1000 requests/minute per principal
    - Real-time connections: 100 concurrent WebSocket connections per document

    ## Error Responses

    All errors follow a consistent format:
    ```json
    {
      "error": "Error message",
      "details": {
        "reason": "Specific reason",
        "suggestions": ["Possible fix"]
      }
    }
    ```

  version: 1.0.0
  contact:
    name: Pantheon Engineering
    url: https://pantheon.io
  license:
    name: Proprietary
    url: https://pantheon.io/terms

servers:
  - url: https://ccr.p1.pantheon.io
    description: Production
  - url: http://localhost:8787
    description: Local Development

tags:
  - name: Health
    description: System health and status
  - name: Authentication
    description: Token issuance and validation
  - name: Organizations
    description: Organization management for agent configuration
  - name: Agents
    description: Agent registry and status management
  - name: Sites
    description: Pantheon site management
  - name: Branches
    description: Branch lifecycle and version control
  - name: Documents
    description: Document inventory and metadata
  - name: Versions
    description: Document version history
  - name: Real-time
    description: Real-time editing and WebSocket connections
  - name: Checkpoints
    description: Named snapshots for rollback
  - name: Merge
    description: Branch merging and conflict resolution
  - name: Merge Requests
    description: Merge request workflow
  - name: Structures
    description: Site hierarchies and navigation
  - name: Structure Nodes
    description: Nodes within site structures
  - name: Document Metadata
    description: Schema-validated document metadata
  - name: Branch Grants
    description: Branch-level authorization
  - name: Presence
    description: Actor presence and awareness
  - name: Site Settings
    description: Per-site cache and workflow configuration
  - name: Site Tokens
    description: Service principal tokens scoped to a site
  - name: Collaborators
    description: User access grants on a site
  - name: Content
    description: Published content delivery (read-only, for CDN/frontend consumption)
  - name: Agent Keys
    description: API key management for agents
  - name: Agent Roles
    description: Site role grants for agents
  - name: Admin
    description: System-level user allowlist management (system admin only)
  - name: OAuth
    description: CSS OAuth 2.0 Authorization Code flow (Google upstream IdP)

security:
  - bearerAuth: []
  - apiKeyHeader: []

paths:
  # ===========================================================================
  # Health & Auth
  # ===========================================================================
  /health:
    get:
      summary: Health check
      description: Returns system health status including database connectivity.
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ===========================================================================
  # OAuth 2.0 (CSS Auth — Google upstream IdP)
  # ===========================================================================
  /auth/authorize:
    get:
      summary: Initiate OAuth 2.0 Authorization Code flow
      description: |
        Validates the client (site) and redirect_uri, registers the client in KV if
        needed, then redirects the browser to Google for user authentication.
        Uses PKCE (code_challenge / code_challenge_method).
      operationId: oauthAuthorize
      tags: [OAuth]
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          description: Site UUID — the OAuth client identifier
          schema:
            type: string
            format: uuid
        - name: redirect_uri
          in: query
          required: true
          description: Must match site's configured allowedOrigins
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to Google authentication
        '400':
          description: Missing or invalid parameters, or redirect_uri not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/callback:
    get:
      summary: OAuth 2.0 callback — exchange Google code for CSS token
      description: |
        Google redirects here after user authentication. Verifies HMAC-signed state,
        re-validates redirect_uri, exchanges Google code, issues a CSS access token,
        and redirects the browser back to the client redirect_uri.
      operationId: oauthCallback
      tags: [OAuth]
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to client with authorization code
        '400':
          description: Invalid or tampered state parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Failed to exchange code with Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Failed to re-validate site configuration (database unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      summary: Get authenticated principal info
      description: Returns the identity of the currently authenticated principal (user, agent, or service).
      operationId: getAuthMe
      tags: [Authentication]
      responses:
        '200':
          description: Authenticated principal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedPrincipal'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ===========================================================================
  # Organizations
  # ===========================================================================
  # ===========================================================================
  # Agents
  # ===========================================================================
  /api/organizations/{orgId}/agents:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
    get:
      summary: List agents
      description: Returns all agents registered in the organization.
      operationId: listAgents
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: status
          in: query
          description: Filter by agent status
          schema:
            $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'

    post:
      summary: Create agent
      description: Registers a new agent in the organization.
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/organizations/{orgId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/agentIdParam'
    get:
      summary: Get agent
      description: Returns details for a specific agent.
      operationId: getAgent
      tags: [Agents]
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update agent
      description: Updates agent name, description, or settings.
      operationId: updateAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete agent
      description: Removes an agent from the registry.
      operationId: deleteAgent
      tags: [Agents]
      responses:
        '204':
          description: Agent deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizations/{orgId}/agents/{agentId}/status:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/agentIdParam'
    put:
      summary: Update agent status
      description: Changes agent status (active, suspended, disabled).
      operationId: updateAgentStatus
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/AgentStatus'
                reason:
                  type: string
                  description: Reason for status change
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/organizations/{orgId}/agents/{agentId}/presence:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/agentIdParam'
    get:
      summary: Get agent global presence
      description: Returns the agent's presence across all sites and documents.
      operationId: getAgentPresence
      tags: [Agents, Presence]
      responses:
        '200':
          description: Agent presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGlobalPresence'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Sites
  # ===========================================================================
  /api/sites:
    get:
      summary: List sites
      description: Returns all sites the principal has access to. Defaults to active (non-archived) sites only.
      operationId: listSites
      tags: [Sites]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: archived
          in: query
          description: Filter by archived state. true = archived only, false = active only (default).
          schema:
            type: boolean
      responses:
        '200':
          description: List of sites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'

    post:
      summary: Create site
      description: Registers a new Pantheon site in the system.
      operationId: createSite
      tags: [Sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Site with pantheonSiteId already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: Get site
      description: Returns details for a specific site.
      operationId: getSite
      tags: [Sites]
      responses:
        '200':
          description: Site details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update site
      description: Updates site name or workflow settings.
      operationId: updateSite
      tags: [Sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Site updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Archive site (soft delete)
      description: Soft-deletes a site by setting archivedAt. Cascades to branches and documents. Fails if the site has active non-archived branches. Recoverable via POST /api/sites/{siteId}/restore.
      operationId: deleteSite
      tags: [Sites]
      responses:
        '204':
          description: Site archived
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Site has active branches or is already archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{siteId}/restore:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    post:
      summary: Restore archived site
      description: Restores a soft-deleted site. Also restores branches and documents that were cascade-archived at the same time; independently-archived branches/docs remain archived.
      operationId: restoreSite
      tags: [Sites]
      responses:
        '200':
          description: Site restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          description: Site not found or not archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{siteId}/presence:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: Get site presence
      description: Returns aggregated presence for all branches and documents in the site.
      operationId: getSitePresence
      tags: [Sites, Presence]
      responses:
        '200':
          description: Site presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePresence'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Branches
  # ===========================================================================
  /api/sites/{siteId}/branches:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: List branches
      description: Returns all branches for a site. Defaults to active (non-archived) branches only.
      operationId: listBranches
      tags: [Branches]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: status
          in: query
          description: Filter by branch status
          schema:
            $ref: '#/components/schemas/BranchStatus'
        - name: archived
          in: query
          description: Filter by archived state. true = archived only, false = active only (default).
          schema:
            type: boolean
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'

    post:
      summary: Create branch
      description: Creates a new branch from a parent branch.
      operationId: createBranch
      tags: [Branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Branch name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{siteId}/branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
    get:
      summary: Get branch
      description: Returns details for a specific branch.
      operationId: getBranch
      tags: [Branches]
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update branch
      description: Updates branch name, description, or status.
      operationId: updateBranch
      tags: [Branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Archive branch (soft delete)
      description: Soft-deletes a branch by setting archivedAt. Cannot archive main branch. Recoverable via POST /api/sites/{siteId}/branches/{branchId}/restore.
      operationId: deleteBranch
      tags: [Branches]
      responses:
        '204':
          description: Branch archived
        '400':
          description: Cannot archive main branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Branch is already archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{siteId}/branches/{branchId}/restore:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
    post:
      summary: Restore archived branch
      description: Restores a soft-deleted branch. Blocked if the parent site is archived.
      operationId: restoreBranch
      tags: [Branches]
      responses:
        '200':
          description: Branch restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          description: Branch not found or not archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{siteId}/branches/{branchId}/presence:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
    get:
      summary: Get branch presence
      description: Returns presence for all documents in the branch.
      operationId: getBranchPresence
      tags: [Branches, Presence]
      responses:
        '200':
          description: Branch presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPresence'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Documents
  # ===========================================================================
  /api/sites/{siteId}/documents:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: List documents
      description: Returns all documents in a site.
      operationId: listDocuments
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: pathPrefix
          in: query
          description: Filter documents by path prefix
          schema:
            type: string
          example: pages/
        - name: archived
          in: query
          description: Include archived documents. Omit or false for active only, true for archived only.
          schema:
            type: boolean
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'

    post:
      summary: Create document
      description: Creates a new document in the site.
      operationId: createDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '409':
          description: Document path already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sites/{siteId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/documentIdParam'
    get:
      summary: Get document
      description: Returns document metadata.
      operationId: getDocument
      tags: [Documents]
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update document path
      description: Updates the document's path.
      operationId: updateDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: New document path
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Archive document
      description: Soft-deletes (archives) a document.
      operationId: deleteDocument
      tags: [Documents]
      responses:
        '204':
          description: Document archived
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sites/{siteId}/documents/{documentId}/restore:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/documentIdParam'
    post:
      summary: Restore archived document
      description: Restores a previously archived document.
      operationId: restoreDocument
      tags: [Documents]
      responses:
        '200':
          description: Document restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sites/{siteId}/documents/by-path/{path}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - name: path
        in: path
        required: true
        description: URL-encoded document path
        schema:
          type: string
    get:
      summary: Get document by path
      description: Returns document by its path.
      operationId: getDocumentByPath
      tags: [Documents]
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Branch-Scoped Documents
  # ===========================================================================
  /api/sites/{siteId}/branches/{branchId}/documents:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
    get:
      summary: List branch documents
      description: Returns documents with versions on this branch. Includes inherited documents from main via copy-on-write fallback.
      operationId: listBranchDocuments
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: pathPrefix
          in: query
          description: Filter documents by path prefix
          schema:
            type: string
      responses:
        '200':
          description: List of documents on branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'

    post:
      summary: Create document on branch
      description: Creates a document with an initial version on this branch.
      operationId: createBranchDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchDocumentRequest'
      responses:
        '201':
          description: Document created with initial version
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '409':
          description: Document path already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===========================================================================
  # Document Versions
  # ===========================================================================
  /api/sites/{siteId}/branches/{branchId}/documents/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - $ref: '#/components/parameters/documentIdParam'
    get:
      summary: List document versions
      description: Returns version history for a document on a branch.
      operationId: listDocumentVersions
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionListResponse'

    post:
      summary: Create document version
      description: Creates a new version with the provided snapshot.
      operationId: createDocumentVersion
      tags: [Versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':

name: CI

on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    name: Install, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workers
        run: pnpm --filter collaborative-state-worker lint
        continue-on-error: true

      - name: Typecheck workers
        run: pnpm --filter collaborative-state-worker typecheck
        continue-on-error: true

      - name: Build p1-content-validator
        run: pnpm --filter @pantheon-systems/p1-content-validator build

      - name: Lint mcp-server
        run: pnpm --filter css-mcp-server lint
        continue-on-error: true

      - name: Typecheck mcp-server
        run: pnpm --filter css-mcp-server typecheck
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests (workers)
        run: pnpm --filter collaborative-state-worker test

      - name: Build p1-content-validator
        run: pnpm --filter @pantheon-systems/p1-content-validator build

      - name: Unit tests (mcp-server)
        run: pnpm --filter css-mcp-server test

  test-integration:
    name: Integration & DB Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cssuser
          POSTGRES_PASSWORD: csspass
          POSTGRES_DB: cssdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cssuser -d cssdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter collaborative-state-worker db:migrate

      - name: DB schema tests
        run: pnpm --filter collaborative-state-worker test:db

      - name: Integration tests
        run: pnpm --filter collaborative-state-worker test:integration

  check-lockfile:
    name: Lockfile is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Enable corepack
        run: corepack enable

      - name: Verify lockfile is up to date
        run: pnpm install --frozen-lockfile

  check-migrations:
    name: Check migration numbering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect duplicate migration numbers
        run: |
          DUPES=$(ls workers/src/db/migrations/*.sql \
            | xargs -n1 basename \
            | grep -oE '^[0-9]+' \
            | sort | uniq -d)

          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate migration number(s) found: $DUPES"
            echo ""
            echo "Each migration file must have a unique numeric prefix."
            echo "Conflicting files:"
            for num in $DUPES; do
              ls workers/src/db/migrations/${num}_*.sql
            done
            exit 1
          fi

          echo "✅ All migration numbers are unique."

packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: true
  sharp: true

ignoredOptionalDependencies:
  - '@fortawesome/free-brands-svg-icons'
  - '@fortawesome/fontawesome-common-types'

minimumReleaseAgeExclude:
  - '@pantheon-systems/p1-ai-chat@0.1.0'

overrides:
  esbuild: '>=0.25.0'
  minimatch: '>=10.2.5'
  markdown-it: '>=14.1.1'
  rollup: '>=4.59.0'
  flatted: '>=3.4.2'
  postcss: '>=8.5.10'
  uuid: '>=14.0.0'
  happy-dom: '>=20.8.9'
  lodash: '>=4.18.0'
  ajv: '>=6.14.0'

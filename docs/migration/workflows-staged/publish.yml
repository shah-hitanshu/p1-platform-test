name: Publish to npm

# STAGED — inert until moved to .github/workflows/ in Phase 4.
# Filename must be publish.yml to match the npm trusted-publisher (OIDC) config;
# activation requires every package's npmjs.com trusted-publisher settings to
# trust repo pantheon-systems/p1-platform + this filename (add-before-remove).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "Version Packages" PR / tags
      pull-requests: write # open the "Version Packages" PR
      id-token: write # npm OIDC trusted publishing (no token)
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"
          scope: "@pantheon-systems"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable packages
        run: pnpm exec turbo run build --filter='./packages/*'

      # Pending changesets -> opens/updates a "Version Packages" PR. No pending
      # changesets (that PR merged) -> publishes to npm via OIDC. The four Puck
      # SDK packages stay a fixed version group (.changeset/config.json).
      - name: Create Release PR or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version to publish (e.g. 1.2.3 or 1.2.3-beta.1). If empty, uses version from package.json.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@pantheon-systems'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build p1-content-validator
        working-directory: packages/p1-content-validator
        run: pnpm build

      - name: Set version override
        if: inputs.version_override != ''
        working-directory: packages/p1-content-validator
        run: npm version "${{ inputs.version_override }}" --no-git-tag-version

      - name: Publish p1-content-validator
        working-directory: packages/p1-content-validator
        run: npm publish

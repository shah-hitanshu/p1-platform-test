name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use package.json versions)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Remove READMEs from packages
        run: find packages -name "README.md" -not -path "*/node_modules/*" -delete

      - name: Publish css-client
        working-directory: packages/css-client
        run: pnpm publish --no-git-checks --access public --provenance

      - name: Publish puck-css
        working-directory: packages/puck-css
        run: pnpm publish --no-git-checks --access public --provenance

      - name: Publish p1-next-sdk
        working-directory: packages/p1-next-sdk
        run: pnpm publish --no-git-checks --access public --provenance

      - name: Publish create-p1-starter-kit
        working-directory: packages/create-p1-starter-kit
        run: pnpm publish --no-git-checks --access public --provenance

# CI — read-only verification. No publishing, no deploys, no GCP/WIF, no write
# permissions.
#
# Every package is linted and type-checked, with no exclusions. Test-only type
# errors in workers/ccr are held to a committed ceiling by
# `check:typecheck-tests` rather than ignored.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Which of the expensive jobs below can this change actually reach? Detected
  # once, so those jobs stay a single `if` each. `turbo ls --affected` does the
  # package-graph work, so no list here has to track a dependency closure. The
  # checkout is depth 2 — the merge commit plus its first parent, which on a
  # pull request is the base branch — because this repo's full history is
  # ~1.8 GiB and fetching it would cost more than the jobs being skipped.
  changes:
    name: which jobs can this change reach?
    runs-on: ubuntu-latest
    outputs:
      starter-components: ${{ steps.scope.outputs.starter-components }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      # The self-test runs first so a regression in the checker fails the build
      # instead of silently skipping a job, as check-npm-leaks.sh already does.
      - id: scope
        run: |
          bash .github/scripts/ci-affected.sh --self-test
          bash .github/scripts/ci-affected.sh

  verify:
    name: build / typecheck / lint / test (hard gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build everything
        run: pnpm exec turbo run build
      # PCC-3819: catch internal-architecture leaks at PR time, not at release
      # time. The publish workflow runs the same check as a final gate; the
      # self-test runs first so a regression in the checker fails the build
      # instead of silently weakening the check.
      - name: Public tarballs carry no internal architecture
        run: |
          bash .github/scripts/check-npm-leaks.sh --self-test
          bash .github/scripts/check-npm-leaks.sh
      - name: Every package has a lint and typecheck task
        run: pnpm check:task-coverage
      - name: Typecheck
        run: pnpm exec turbo run typecheck
      - name: Lint
        run: pnpm exec turbo run lint lint:root
      # @p1/agent asserts the pre-PCC-3239 slot-ID semantics against an
      # unreleased workspace validator; the fix is cross-team, not ours.
      - name: Test
        run: pnpm exec turbo run test --filter='!@p1/agent' --concurrency=4
      - name: Test type errors stay at or below the committed ceiling
        run: pnpm check:typecheck-tests

  # Warnings are not a hard gate, so they need somewhere to be visible other
  # than a log nobody reads. Code scanning annotates them on the lines a PR
  # actually touches and keeps a durable record of the rest.
  lint-sarif:
    name: lint warnings → code scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # upload-sarif reads the workflow run itself, which an internal repo gates.
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build everything
        run: pnpm exec turbo run build
      # Findings, not pass/fail — the hard gate is the `verify` job. Type-aware
      # rules need the workspace built first or they report against `any`.
      - name: Lint to SARIF
        run: pnpm lint:sarif
      # A single run: code scanning rejects multiple runs sharing a category.
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sarif/eslint.sarif
          category: eslint

  integration-db:
    name: postgres integration (CCR worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cssuser
          POSTGRES_PASSWORD: csspass
          POSTGRES_DB: cssdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cssuser -d cssdb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_CONNECTION_STRING: postgresql://cssuser:csspass@localhost:5432/cssdb
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build worker dependencies
        run: pnpm exec turbo run build --filter='ccr-worker^...'
      - name: Migrations (duplicate-number guard + fresh schema)
        run: |
          dupes=$(ls workers/ccr/src/db/migrations/*.sql | sed 's|.*/||; s/_.*//' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "Duplicate migration numbers: $dupes"; exit 1; fi
          pnpm --filter ccr-worker db:migrate
      - name: DB + integration tests
        run: |
          pnpm --filter ccr-worker test:db
          pnpm --filter ccr-worker test:integration

  # Nothing else ever installs a generated project, so a template that scaffolds
  # into something that cannot `pnpm install` (it has happened — PCC-3623) is
  # invisible until a customer hits it. The scaffold installs against packed
  # tarballs of the in-repo packages, so this gates unpublished code.
  #
  # Only the five in-repo packages are pinned, to packed tarballs. Everything else
  # resolves fresh — the scaffold has no lockfile and does not inherit the root's
  # overrides — which is what a customer gets, but also means an unrelated upstream
  # publish can turn this job red on a PR that changed nothing here.
  scaffold:
    name: scaffolded project lints, installs, builds, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the packages the scaffold consumes
        run: pnpm exec turbo run build --filter='@pantheon-systems/css-client' --filter='@pantheon-systems/puck-css' --filter='@pantheon-systems/p1-next-sdk' --filter='@pantheon-systems/p1-ai-chat' --filter='@pantheon-systems/p1-media'
      # Also lints the built template before scaffolding: a monorepo-relative path
      # or an import of an unpublished package installs and builds fine here and
      # only fails on a customer's machine.
      - name: Scaffold a project and install/build/typecheck/test it against packed tarballs
        run: pnpm --filter @pantheon-systems/create-p1-starter-kit test:scaffold

  e2e:
    name: playwright e2e (starter app vs mock backend)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build starter dependencies
        run: pnpm exec turbo run build --filter='@pantheon-systems/p1-starter^...'
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  starter-components:
    name: starter-components (storybook + registry build)
    needs: changes
    if: needs.changes.outputs.starter-components == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium is installed here and not in `verify` so the repo's main
      # gate keeps its current runtime. No `--with-deps`: it runs `apt-get
      # update` across every repo configured on the runner, and a bad index on
      # Google's preinstalled Chrome repo has failed this step for reasons that
      # have nothing to do with the PR. The e2e job launches Chromium on the
      # same image without it.
      - run: pnpm exec playwright install chromium
      - name: Build starter-components dependencies
        run: pnpm exec turbo run build --filter='@pantheon-systems/p1-starter-components^...'
      - name: Render every story
        run: pnpm --filter @pantheon-systems/p1-starter-components test:storybook
      - name: Build the static Storybook
        run: pnpm --filter @pantheon-systems/p1-starter-components build-storybook
      - name: Build the code registry
        run: pnpm --filter @pantheon-systems/p1-starter-components registry:build
      - name: Test and typecheck the catalog app
        run: |
          pnpm --filter @pantheon-systems/p1-registry test
          pnpm --filter @pantheon-systems/p1-registry typecheck
      # The only check that exercises the registry the way a consumer does:
      # installs every block into a bare app and builds it. In-repo typecheck
      # passes on files that are never published, so it cannot catch this.
      - name: Install every block into a bare app and build it
        run: pnpm --filter @pantheon-systems/p1-starter-components verify:registry
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starter-components-storybook
          path: packages/p1-starter-components/storybook-static/
          retention-days: 7

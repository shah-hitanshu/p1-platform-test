name: Deploy Storybook

# Deploys packages/p1-starter-components' Storybook to GitHub Pages.
# Requires Settings -> Pages -> Source: GitHub Actions.
#
# Viewing the result requires a Pantheon GitHub login while the repo is
# private (PCC-3580 spec, R1).

on:
  push:
    branches: [main]
    paths:
      - 'packages/p1-starter-components/**'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the static Storybook
        run: pnpm --filter @pantheon-systems/p1-starter-components build-storybook
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/p1-starter-components/storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4

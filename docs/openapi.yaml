openapi: 3.0.3
info:
  title: Collaborative State System API
  description: |
    REST API for the Collaborative State System (CSS) - a JSON state versioning
    and real-time collaboration platform built on Cloudflare Workers and Durable Objects.

    ## Overview

    The Collaborative State System provides:
    - **Version Control**: Git-like branching and merging for JSON documents
    - **Real-time Collaboration**: WebSocket-based CRDT synchronization
    - **Agent Politeness**: AI agent coordination with human-first editing priority
    - **Presence Awareness**: Real-time visibility of who is editing what

    ## Authentication

    All authenticated endpoints require one of:
    - **Bearer Token**: `Authorization: Bearer <jwt-token>`
    - **API Key**: `X-API-Key: <api-key>` header or `?apiKey=<key>` query parameter

    ## Rate Limits

    - Standard endpoints: 1000 requests/minute per principal
    - Real-time connections: 100 concurrent WebSocket connections per document

    ## Error Responses

    All errors follow a consistent format:
    ```json
    {
      "error": "Error message",
      "details": {
        "reason": "Specific reason",
        "suggestions": ["Possible fix"]
      }
    }
    ```

  version: 1.0.0
  contact:
    name: Pantheon Engineering
    url: https://pantheon.io
  license:
    name: Proprietary
    url: https://pantheon.io/terms

servers:
  - url: https://css.pantheon.io/api
    description: Production
  - url: https://css-staging.pantheon.io/api
    description: Staging
  - url: http://localhost:8787/api
    description: Local Development

tags:
  - name: Health
    description: System health and status
  - name: Authentication
    description: Token issuance and validation
  - name: Organizations
    description: Organization management for agent configuration
  - name: Agents
    description: Agent registry and status management
  - name: Sites
    description: Pantheon site management
  - name: Branches
    description: Branch lifecycle and version control
  - name: Documents
    description: Document inventory and metadata
  - name: Versions
    description: Document version history
  - name: Real-time
    description: Real-time editing and WebSocket connections
  - name: Checkpoints
    description: Named snapshots for rollback
  - name: Merge
    description: Branch merging and conflict resolution
  - name: Merge Requests
    description: Merge request workflow
  - name: Structures
    description: Site hierarchies and navigation
  - name: Structure Nodes
    description: Nodes within site structures
  - name: Document Metadata
    description: Schema-validated document metadata
  - name: Branch Grants
    description: Branch-level authorization
  - name: Presence
    description: Actor presence and awareness

security:
  - bearerAuth: []
  - apiKeyHeader: []

paths:
  # ===========================================================================
  # Health & Auth
  # ===========================================================================
  /health:
    get:
      summary: Health check
      description: Returns system health status including database connectivity.
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/users:
    get:
      summary: List test users (development only)
      description: Returns available test users for local development authentication.
      operationId: listTestUsers
      tags: [Authentication]
      security: []
      responses:
        '200':
          description: List of test users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/MockUser'
                  agents:
                    type: array
                    items:
                      $ref: '#/components/schemas/MockAgent'
        '403':
          description: Not available in production
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/token:
    post:
      summary: Issue authentication token
      description: Issues a JWT token for a user or agent principal.
      operationId: issueToken
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UserTokenRequest'
                - $ref: '#/components/schemas/AgentTokenRequest'
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===========================================================================
  # Organizations
  # ===========================================================================
  /organizations:
    get:
      summary: List organizations
      description: Returns all organizations the principal has access to.
      operationId: listOrganizations
      tags: [Organizations]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create organization
      description: Creates a new organization for agent configuration.
      operationId: createOrganization
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations/{orgId}:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
    get:
      summary: Get organization
      description: Returns details for a specific organization.
      operationId: getOrganization
      tags: [Organizations]
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update organization
      description: Updates organization name or settings.
      operationId: updateOrganization
      tags: [Organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete organization
      description: Deletes an organization. Fails if agents are registered.
      operationId: deleteOrganization
      tags: [Organizations]
      responses:
        '204':
          description: Organization deleted
        '409':
          description: Organization has registered agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===========================================================================
  # Agents
  # ===========================================================================
  /organizations/{orgId}/agents:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
    get:
      summary: List agents
      description: Returns all agents registered in the organization.
      operationId: listAgents
      tags: [Agents]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: status
          in: query
          description: Filter by agent status
          schema:
            $ref: '#/components/schemas/AgentStatus'
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'

    post:
      summary: Create agent
      description: Registers a new agent in the organization.
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /organizations/{orgId}/agents/{agentId}:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/agentIdParam'
    get:
      summary: Get agent
      description: Returns details for a specific agent.
      operationId: getAgent
      tags: [Agents]
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update agent
      description: Updates agent name, description, or settings.
      operationId: updateAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete agent
      description: Removes an agent from the registry.
      operationId: deleteAgent
      tags: [Agents]
      responses:
        '204':
          description: Agent deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/agents/{agentId}/status:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/agentIdParam'
    put:
      summary: Update agent status
      description: Changes agent status (active, suspended, disabled).
      operationId: updateAgentStatus
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/AgentStatus'
                reason:
                  type: string
                  description: Reason for status change
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredAgent'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{orgId}/agents/{agentId}/presence:
    parameters:
      - $ref: '#/components/parameters/orgIdParam'
      - $ref: '#/components/parameters/agentIdParam'
    get:
      summary: Get agent global presence
      description: Returns the agent's presence across all sites and documents.
      operationId: getAgentPresence
      tags: [Agents, Presence]
      responses:
        '200':
          description: Agent presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentGlobalPresence'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Sites
  # ===========================================================================
  /sites:
    get:
      summary: List sites
      description: Returns all sites the principal has access to.
      operationId: listSites
      tags: [Sites]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of sites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'

    post:
      summary: Create site
      description: Registers a new Pantheon site in the system.
      operationId: createSite
      tags: [Sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Site created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Site with pantheonSiteId already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: Get site
      description: Returns details for a specific site.
      operationId: getSite
      tags: [Sites]
      responses:
        '200':
          description: Site details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update site
      description: Updates site name or workflow settings.
      operationId: updateSite
      tags: [Sites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Site updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete site
      description: Deletes a site and all associated data.
      operationId: deleteSite
      tags: [Sites]
      responses:
        '204':
          description: Site deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/presence:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: Get site presence
      description: Returns aggregated presence for all branches and documents in the site.
      operationId: getSitePresence
      tags: [Sites, Presence]
      responses:
        '200':
          description: Site presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePresence'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Branches
  # ===========================================================================
  /sites/{siteId}/branches:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: List branches
      description: Returns all branches for a site.
      operationId: listBranches
      tags: [Branches]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: status
          in: query
          description: Filter by branch status
          schema:
            $ref: '#/components/schemas/BranchStatus'
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchListResponse'

    post:
      summary: Create branch
      description: Creates a new branch from a parent branch.
      operationId: createBranch
      tags: [Branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Branch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Branch name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sites/{siteId}/branches/{branchId}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
    get:
      summary: Get branch
      description: Returns details for a specific branch.
      operationId: getBranch
      tags: [Branches]
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update branch
      description: Updates branch name, description, or status.
      operationId: updateBranch
      tags: [Branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Branch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete branch
      description: Deletes a branch. Cannot delete main branch.
      operationId: deleteBranch
      tags: [Branches]
      responses:
        '204':
          description: Branch deleted
        '400':
          description: Cannot delete main branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/branches/{branchId}/presence:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
    get:
      summary: Get branch presence
      description: Returns presence for all documents in the branch.
      operationId: getBranchPresence
      tags: [Branches, Presence]
      responses:
        '200':
          description: Branch presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPresence'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Documents
  # ===========================================================================
  /sites/{siteId}/documents:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
    get:
      summary: List documents
      description: Returns all documents in a site.
      operationId: listDocuments
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: pathPrefix
          in: query
          description: Filter documents by path prefix
          schema:
            type: string
          example: pages/
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'

    post:
      summary: Create document
      description: Creates a new document in the site.
      operationId: createDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '409':
          description: Document path already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sites/{siteId}/documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/documentIdParam'
    get:
      summary: Get document
      description: Returns document metadata.
      operationId: getDocument
      tags: [Documents]
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update document path
      description: Updates the document's path.
      operationId: updateDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
                  description: New document path
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Archive document
      description: Soft-deletes (archives) a document.
      operationId: deleteDocument
      tags: [Documents]
      responses:
        '204':
          description: Document archived
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/documents/{documentId}/restore:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/documentIdParam'
    post:
      summary: Restore archived document
      description: Restores a previously archived document.
      operationId: restoreDocument
      tags: [Documents]
      responses:
        '200':
          description: Document restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/documents/by-path/{path}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - name: path
        in: path
        required: true
        description: URL-encoded document path
        schema:
          type: string
    get:
      summary: Get document by path
      description: Returns document by its path.
      operationId: getDocumentByPath
      tags: [Documents]
      responses:
        '200':
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Branch-Scoped Documents
  # ===========================================================================
  /sites/{siteId}/branches/{branchId}/documents:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
    get:
      summary: List branch documents
      description: Returns documents with versions on this branch.
      operationId: listBranchDocuments
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of documents on branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'

    post:
      summary: Create document on branch
      description: Creates a document with an initial version on this branch.
      operationId: createBranchDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchDocumentRequest'
      responses:
        '201':
          description: Document created with initial version
          content:
            application/json:
              schema:
                type: object
                properties:
                  document:
                    $ref: '#/components/schemas/Document'
                  version:
                    $ref: '#/components/schemas/DocumentVersion'
        '409':
          description: Document path already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===========================================================================
  # Document Versions
  # ===========================================================================
  /sites/{siteId}/branches/{branchId}/documents/{documentId}/versions:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - $ref: '#/components/parameters/documentIdParam'
    get:
      summary: List document versions
      description: Returns version history for a document on a branch.
      operationId: listDocumentVersions
      tags: [Versions]
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: List of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionListResponse'

    post:
      summary: Create document version
      description: Creates a new version with the provided snapshot.
      operationId: createDocumentVersion
      tags: [Versions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: Version created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'

  /sites/{siteId}/branches/{branchId}/documents/{documentId}/versions/latest:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - $ref: '#/components/parameters/documentIdParam'
    get:
      summary: Get latest version
      description: Returns the latest version of a document on a branch.
      operationId: getLatestDocumentVersion
      tags: [Versions]
      responses:
        '200':
          description: Latest version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/branches/{branchId}/documents/{documentId}/versions/{versionId}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - $ref: '#/components/parameters/documentIdParam'
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get specific version
      description: Returns a specific version by ID.
      operationId: getDocumentVersion
      tags: [Versions]
      responses:
        '200':
          description: Version details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersion'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===========================================================================
  # Real-time Document Operations
  # ===========================================================================
  /sites/{siteId}/branches/{branchId}/documents/{documentPath}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        description: Document path (URL-encoded)
        schema:
          type: string
    get:
      summary: Get current document state
      description: Returns the current CRDT-resolved state of a document.
      operationId: getDocumentState
      tags: [Real-time]
      responses:
        '200':
          description: Current document state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentState'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/branches/{branchId}/documents/{documentPath}/connect:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    get:
      summary: WebSocket connection
      description: |
        Upgrades to WebSocket for real-time CRDT synchronization.

        **Protocol:**
        - Binary frames: Yjs CRDT updates
        - Text frames: JSON presence messages

        **Client Messages:**
        - `focus_region_update`: Update actor's focus regions
        - `presence_heartbeat`: Keep-alive with optional state update

        **Server Messages:**
        - `presence_update`: Full presence sync
        - `focus_region_broadcast`: Other actor's focus changed
        - `focus_region_ack`: Confirmation of focus update
        - `presence_error`: Error in presence operation
      operationId: connectDocument
      tags: [Real-time]
      parameters:
        - name: apiKey
          in: query
          description: API key for WebSocket auth
          schema:
            type: string
      responses:
        '101':
          description: Switching to WebSocket protocol
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /sites/{siteId}/branches/{branchId}/documents/{documentPath}/edits:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Apply edit operations
      description: Applies programmatic edit operations to a document.
      operationId: applyEdits
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOperationsRequest'
      responses:
        '200':
          description: Edits applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Concurrent edit conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===========================================================================
  # Agent Edit Workflow
  # ===========================================================================
  /sites/{siteId}/branches/{branchId}/documents/{documentPath}/can-agent-edit:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Check if agent can edit
      description: |
        Checks whether an agent is allowed to edit the document based on:
        - Human presence and activity
        - Target region conflicts
        - Agent status
      operationId: canAgentEdit
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditCheckRequest'
      responses:
        '200':
          description: Edit permission check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEditPermission'

  /sites/{siteId}/branches/{branchId}/documents/{documentPath}/agent-edit-start:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Start agent edit session
      description: |
        Begins an agent edit session:
        - Creates pre-edit checkpoint (for rollback)
        - Registers agent presence with edit intent
        - Locks target regions from other agents
      operationId: agentEditStart
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditStartRequest'
      responses:
        '200':
          description: Edit session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEditStartResponse'
        '403':
          description: Agent not allowed to edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEditPermission'

  /sites/{siteId}/branches/{branchId}/documents/{documentPath}/agent-edit-complete:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Complete agent edit session
      description: |
        Completes an agent edit session:
        - Creates post-edit checkpoint
        - Releases region locks
        - Updates agent presence state
      operationId: agentEditComplete
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditCompleteRequest'
      responses:
        '200':
          description: Edit session completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkpoint:
                    $ref: '#/components/schemas/Checkpoint'

  /sites/{siteId}/branches/{branchId}/documents/{documentPath}/agent-edit-abort:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Abort agent edit session
      description: |
        Aborts an agent edit session:
        - Reverts to pre-edit checkpoint
        - Releases region locks
        - Marks checkpoint as rolled back
      operationId: agentEditAbort
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditAbortRequest'
      responses:
        '200':
          description: Edit session aborted
          content:
            application/json:
              schema:
                type: object
                properties:
                  rolledBackTo:
                    $ref: '#/components/schemas/Checkpoint'

  /sites/{siteId}/branches/{branchId}/documents/{documentPath}/focus-regions:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Update agent focus regions
      description: Updates the agent's declared focus regions without WebSocket.
      operationId: updateFocusRegions
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, focusRegions]
              properties:
                agentId:
                  type: string
                  format: uuid
                focusRegions:
                  type: array
                  items:
                    type: string
                  description: JSON paths the agent is focused on
      responses:
        '200':
          description: Focus regions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean


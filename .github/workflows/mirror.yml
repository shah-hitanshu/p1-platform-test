name: Mirror npm packages to GitHub Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      pds_design_tokens_version:
        description: 'pds-design-tokens version (leave empty for latest)'
        required: false
        type: string
      pds_toolkit_react_version:
        description: 'pds-toolkit-react version (leave empty for latest)'
        required: false
        type: string

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@pantheon-systems'

      - name: Mirror pds-design-tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.pds_design_tokens_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view @pantheon-systems/pds-design-tokens version --registry https://registry.npmjs.org)
          fi
          echo "Mirroring @pantheon-systems/pds-design-tokens@${VERSION}"
          npm pack @pantheon-systems/pds-design-tokens@"${VERSION}" --registry https://registry.npmjs.org
          if npm publish pantheon-systems-pds-design-tokens-*.tgz 2>&1; then
            echo "Published successfully"
          else
            echo "Skipped (version likely already exists on GitHub Packages)"
          fi

      - name: Mirror pds-toolkit-react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.pds_toolkit_react_version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view @pantheon-systems/pds-toolkit-react version --registry https://registry.npmjs.org)
          fi
          echo "Mirroring @pantheon-systems/pds-toolkit-react@${VERSION}"
          npm pack @pantheon-systems/pds-toolkit-react@"${VERSION}" --registry https://registry.npmjs.org
          if npm publish pantheon-systems-pds-toolkit-react-*.tgz 2>&1; then
            echo "Published successfully"
          else
            echo "Skipped (version likely already exists on GitHub Packages)"
          fi

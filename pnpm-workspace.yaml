packages:
  - 'packages/*'
  - 'apps/*'
  - 'workers/*'
  - 'examples/*'

confirmModulesPurge: false

# Union of the four source repos' overrides. Where the same package was pinned
# differently, the strictest spec that satisfies every repo's intent was kept.
overrides:
  # Source repos all resolved 0.21.1; fresh resolution drifted to a split 0.21.3/0.22.2
  # (puck-css declares it as peer >=0.21.0, so auto-install grabbed latest). Revisit
  # as a deliberate upgrade once the tree is stable.
  '@puckeditor/core': '0.21.1'
  esbuild: '^0.28.1'
  undici: '7.29.0'
  minimatch: '>=10.2.5'
  markdown-it: '14.2.0'
  rollup: '>=4.59.0'
  flatted: '>=3.4.2'
  postcss: '8.5.23'
  uuid: '>=14.0.0'
  happy-dom: '>=20.8.9'
  lodash: '>=4.18.0'
  # Scoped: an unscoped '>=6.14.0' collapses @eslint/eslintrc's ajv@6 to ajv@8,
  # which crashes ESLint. ajv@8 consumers already resolve >=8.20 naturally.
  'ajv@<7': '^6.15.0'
  # VUL pins from the source repos' security-update commits (css/puck/chatbot/media,
  # 2026-08-04), exact where upstream pinned exact:
  form-data: '4.0.6'
  hono: '4.12.34'
  '@hono/node-server': '2.0.10'
  body-parser: '2.3.0'
  fast-uri: '3.1.5'
  ip-address: '10.4.0'
  axios: '>=1.18.0'
  '@babel/core': '>=7.29.6'
  brace-expansion: '5.0.9'
  linkify-it: '5.0.2'
  'js-yaml@3': '3.15.1'
  'js-yaml@4': '4.3.1'
  dompurify: '3.4.13'
  sharp: '0.35.3'
  next: '16.2.12'
  '@remix-run/router': '>=1.23.2'
  '@babel/runtime': '>=7.26.10'
  prismjs: '>=1.30.0'
  markdown-to-jsx: '>=7.4.0'
  qs: '>=6.14.2'
  'wrangler>path-to-regexp': '^8.4.0'
  # Scoped: p1-chatbot pinned vitest's vite@8 exactly; puck-css legitimately uses vite@6.
  'vite@^8.0.0': '8.0.16'
  ws: '^8.21.0'

allowBuilds:
  browser-tabs-lock: true
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true

ignoredOptionalDependencies:
  - '@fortawesome/free-brands-svg-icons'
  - '@fortawesome/fontawesome-common-types'

# The workspace historically contained both @types/react 18 (css-frontend, since removed) and 19
# (everything else). These libs' .d.ts import react types without declaring a
# @types/react peer, so they'd otherwise resolve via pnpm's arbitrary fallback dir.
packageExtensions:
  '@puckeditor/core':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@tanstack/react-query':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.112.3'

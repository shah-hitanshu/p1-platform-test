name: Deploy Registry to Pantheon Live

# Fires when the deploy PR is merged into registry-deploy. Pushes the next
# sequential pantheon_live_N tag so Pantheon promotes the build to Live.
# Dev auto-deploys from every push to registry-deploy; only Live needs the tag.

on:
  push:
    branches: [registry-deploy]
    paths: ['registry-builds/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-live
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm this is a registry deploy commit
        run: |
          git log -1 --pretty=%s | grep -q '^deploy: registry ' \
            || { echo "Not a registry deploy commit — refusing to tag"; exit 1; }

      - name: Push the next sequential pantheon_live_N tag
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          LAST=$(git tag -l 'pantheon_live_*' | sed 's/pantheon_live_//' | sort -n | tail -1)
          NEXT=$(( ${LAST:-0} + 1 ))
          git tag "pantheon_live_$NEXT"
          git push origin "pantheon_live_$NEXT"
          echo "Pushed pantheon_live_$NEXT" >> "$GITHUB_STEP_SUMMARY"

name: Deploy Workers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - sbx1
          - production
      run_migrations:
        description: "Run DB migrations before deploy"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run (no actual deploy)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: workers

      - name: Authenticate to GCP
        if: inputs.run_migrations
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Start Cloud SQL Auth Proxy
        if: inputs.run_migrations
        run: |
          URL="https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.21.2"
          curl "$URL/cloud-sql-proxy.linux.amd64" -o cloud-sql-proxy
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "${{ vars.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" &
          sleep 3
      - name: Run migrations
        if: inputs.run_migrations
        run: pnpm db:migrate
        working-directory: workers
        env:
          POSTGRES_CONNECTION_STRING: postgresql://${{ secrets.CLOUDSQL_DB_USER }}:${{ secrets.CLOUDSQL_DB_PASSWORD }}@localhost:5432/${{ secrets.CLOUDSQL_DB_NAME }}

      - name: Deploy
        run: >
          pnpm exec wrangler deploy
          --env ${{ inputs.environment }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  frontend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@b307475762933b98ed359c036b0e51f26b63b74b # v5.0.0
        with:
          version: 10

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build
        run: pnpm build
        working-directory: frontend

      - name: Deploy
        run: >
          pnpm exec wrangler deploy
          --env ${{ inputs.environment }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

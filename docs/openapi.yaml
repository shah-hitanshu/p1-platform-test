  # ===========================================================================
  # Real-time Document Operations
  # ===========================================================================
  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        description: Document path (URL-encoded)
        schema:
          type: string
    get:
      summary: Get current document state
      description: Returns the current resolved state of a document.
      operationId: getDocumentState
      tags: [Real-time]
      responses:
        '200':
          description: Current document state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentState'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}/connect:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    get:
      summary: WebSocket connection
      description: |
        Upgrades to WebSocket for real-time collaborative editing.

        **Protocol:**
        - Binary frames: collaborative sync updates
        - Text frames: JSON presence messages

        **Client Messages:**
        - `focus_region_update`: Update actor's focus regions
        - `presence_heartbeat`: Keep-alive with optional state update

        **Server Messages:**
        - `presence_update`: Full presence sync
        - `focus_region_broadcast`: Other actor's focus changed
        - `focus_region_ack`: Confirmation of focus update
        - `presence_error`: Error in presence operation
      operationId: connectDocument
      tags: [Real-time]
      parameters:
        - name: apiKey
          in: query
          description: API key for WebSocket auth
          schema:
            type: string
      responses:
        '101':
          description: Switching to WebSocket protocol
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}/edits:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Apply edit operations
      description: Applies programmatic edit operations to a document.
      operationId: applyEdits
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOperationsRequest'
      responses:
        '200':
          description: Edits applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Concurrent edit conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===========================================================================
  # Agent Edit Workflow
  # ===========================================================================
  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}/can-agent-edit:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Check if agent can edit
      description: |
        Checks whether an agent is allowed to edit the document based on:
        - Human presence and activity
        - Target region conflicts
        - Agent status
      operationId: canAgentEdit
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditCheckRequest'
      responses:
        '200':
          description: Edit permission check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEditPermission'

  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}/agent-edit-start:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Start agent edit session
      description: |
        Begins an agent edit session:
        - Creates pre-edit checkpoint (for rollback)
        - Registers agent presence with edit intent
        - Locks target regions from other agents
      operationId: agentEditStart
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditStartRequest'
      responses:
        '200':
          description: Edit session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEditStartResponse'
        '403':
          description: Agent not allowed to edit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEditPermission'

  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}/agent-edit-complete:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Complete agent edit session
      description: |
        Completes an agent edit session:
        - Creates post-edit checkpoint
        - Releases region locks
        - Updates agent presence state
      operationId: agentEditComplete
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditCompleteRequest'
      responses:
        '200':
          description: Edit session completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkpoint:
                    $ref: '#/components/schemas/Checkpoint'

  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}/agent-edit-abort:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Abort agent edit session
      description: |
        Aborts an agent edit session:
        - Reverts to pre-edit checkpoint
        - Releases region locks
        - Marks checkpoint as rolled back
      operationId: agentEditAbort
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentEditAbortRequest'
      responses:
        '200':
          description: Edit session aborted
          content:
            application/json:
              schema:
                type: object
                properties:
                  rolledBackTo:
                    $ref: '#/components/schemas/Checkpoint'

  /api/sites/{siteId}/branches/{branchId}/documents/{documentPath}/focus-regions:
    parameters:
      - $ref: '#/components/parameters/siteIdParam'
      - $ref: '#/components/parameters/branchIdParam'
      - name: documentPath
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Update agent focus regions
      description: Updates the agent's declared focus regions without WebSocket.
      operationId: updateFocusRegions
      tags: [Real-time]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, focusRegions]
              properties:
                agentId:
                  type: string
                  format: uuid
                focusRegions:
                  type: array
                  items:
                    type: string
                  description: JSON paths the agent is focused on
      responses:
        '200':
          description: Focus regions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean


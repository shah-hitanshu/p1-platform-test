name: Terraform Plan

# STAGED — inert until moved to .github/workflows/ in Phase 4.
# Prerequisites: WIF binding for p1-platform + repo-level vars (see README.md).
# Activate LAST: this runs on every terraform/** PR and fails auth until trusted.

on:
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "~> 1.6"

      - name: Terraform fmt
        run: terraform fmt -check -recursive -diff
        working-directory: terraform

  plan:
    name: Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    # WIF and the Cloudflare token are unavailable to forks and Dependabot, so a
    # plan can't authenticate there. fmt still runs for every contributor.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    # The plan job runs on any same-repo PR and authenticates as the read-only plan SA.
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            project_var: STAGING_GCP_PROJECT_ID
            cloudflare_var: STAGING_CLOUDFLARE_ACCOUNT_ID
          - environment: production
            project_var: PRODUCTION_GCP_PROJECT_ID
            cloudflare_var: PRODUCTION_CLOUDFLARE_ACCOUNT_ID
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to GCP
        uses: pantheon-systems/common-gh/auth-wif@0a1dafc525b4ffa9fcfbfcf1c889dc0251c0c4e4 # main @ 2026-06
        with:
          service_account: css-github-actions-plan@${{ vars[matrix.project_var] }}.iam.gserviceaccount.com

      - name: Fetch Cloudflare API token
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            cf_token:${{ vars[matrix.project_var] }}/P1_CF_DEPLOY_TOKEN

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "~> 1.6"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan

# STAGED — inert until moved to .github/workflows/ in Phase 4.
# Prerequisites: WIF binding for p1-platform + repo-level vars (see README.md).
# Activate LAST: this runs on every terraform/** PR and fails auth until trusted.
        # The read-only plan SA can't take the GCS state lock.
        run: terraform plan -lock=false -out=tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.secrets.outputs.cf_token }}
          TF_VAR_gcp_project: ${{ vars[matrix.project_var] }}
          TF_VAR_cloudflare_account_id: ${{ vars[matrix.cloudflare_var] }}

      - name: Post plan comment
        uses: borchero/terraform-plan-comment@2d41e908725447b1677913001dfb92fa7010c025 # v3.1.0
        with:
          token: ${{ github.token }}
          planfile: tfplan
          working-directory: terraform/environments/${{ matrix.environment }}
          header: "📝 Terraform Plan (${{ matrix.environment }})"
